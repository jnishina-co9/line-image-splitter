<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像分割ツール</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="header-section">
            <h1>IMAGE SPLITTER</h1>
            <div class="subtitle">- 画像分割ツール -</div>
        </div>

        <div class="card">
            <!-- Step 1 -->
            <div class="step-section">
                <h2 class="step-title"><i data-lucide="image"></i> 1. 画像を選択</h2>
                <div class="file-drop-area" id="dropZone" onclick="document.getElementById('splitInput').click()">
                    <i data-lucide="upload-cloud" class="icon"></i>
                    <div class="file-label">クリックして画像ファイルを選択</div>
                    <div class="file-sub-label">または、ここにドラッグ＆ドロップ（PNG / JPG）</div>
                    <div id="previewContainer" class="preview-container" style="display: none;">
                        <img id="selectedImagePreview" src="" alt="選択されたプレビュー画像">
                    </div>
                    <div id="fileNameDisplay" class="file-name">未選択</div>
                    <input type="file" id="splitInput" accept="image/png, image/jpeg" onchange="handleFileChange(event)">
                </div>
            </div>

            <!-- Step 2 -->
            <div class="step-section">
                <h2 class="step-title"><i data-lucide="grid"></i> 2. 分割数（タテ × ヨコ）</h2>
                <p style="font-size: 14px; color: #00c9a7; font-weight: 500; margin: 0;">※ 各値は1〜50の範囲で入力してください。</p>
                <div class="grid-inputs">
                    <div class="input-group">
                        <span>タテ (Rows)</span>
                        <input type="number" id="rows" value="2" min="1" max="50">
                    </div>
                    <div class="input-group">
                        <span>ヨコ (Cols)</span>
                        <input type="number" id="cols" value="4" min="1" max="50">
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <div class="actions-group">
                <button id="splitBtn" class="btn-primary" onclick="handleSplit()" disabled>
                    <i data-lucide="scissors"></i> 分割を実行する
                </button>
            </div>
        </div>

        <!-- Results Area -->
        <div id="resultArea" class="result-wrapper" style="display: none;">
            <div class="card">
                <h2 class="step-title"><i data-lucide="layout-grid"></i> 分割結果</h2>
                <div id="splitResults" class="result-container"></div>
                <div class="actions-group">
                    <button id="splitZipBtn" class="btn-primary" style="display: none;" onclick="downloadZip()">
                        <i data-lucide="package"></i> まとめてZIP保存
                    </button>
                    <button id="resetAndTopBtn" class="btn-secondary" onclick="handleResetAndTop()">
                        <i data-lucide="rotate-ccw"></i> リセットしてトップに戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- フッター上の案内テキスト -->
        <div class="notice-box">
            <p class="notice-text"><span><a href="https://creator.line.me/ja/guideline/sticker/" target="_blank" rel="noopener noreferrer">LINE公式制作ガイドライン</a>に基づく仕様です。</span><span>審査通過を保証するものではありません。</span></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script src="app.js"></script>

    <!-- ===== Footer ===== -->
    <footer class="site-footer">
        <p class="footer-copy">© 2026 深森呼吸</p>
    </footer>
</body>

</html>
